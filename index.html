    // ==================== APLICAÇÃO PRINCIPAL (APP COMPONENT) ====================
    function App() {
      const [currentTab, setCurrentTab] = useState('pipeline');
      const [leads, setLeads] = useState(() => {
        try {
          const saved = localStorage.getItem('botclientes_leads');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.filter(l => l.id && !['lead-1', 'lead-2', 'lead-3', 'lead-4'].includes(l.id) && !l.id.startsWith('mock-'));
            }
          }
        } catch(e) {}
        return [];
      });

      const [campaigns, setCampaigns] = useState(() => {
        try {
          const saved = localStorage.getItem('botclientes_campaigns');
          return saved ? JSON.parse(saved) : INITIAL_CAMPAIGNS;
        } catch(e) { return INITIAL_CAMPAIGNS; }
      });

      const [activeCampId, setActiveCampId] = useState(() => {
        return localStorage.getItem('botclientes_active_camp_id') || 'camp-1';
      });

      const [activeChatLeadId, setActiveChatLeadId] = useState(null);
      const [activeCallLeadId, setActiveCallLeadId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      
      // Modais
      const [isNewLeadModalOpen, setIsNewLeadModalOpen] = useState(false);
      const [isOutreachModalOpen, setIsOutreachModalOpen] = useState(false);
      const [outreachLead, setOutreachLead] = useState(null);

      // Persistência
      useEffect(() => {
        localStorage.setItem('botclientes_leads', JSON.stringify(leads));
      }, [leads]);

      useEffect(() => {
        localStorage.setItem('botclientes_campaigns', JSON.stringify(campaigns));
      }, [campaigns]);

      useEffect(() => {
        localStorage.setItem('botclientes_active_camp_id', activeCampId);
      }, [activeCampId]);

      const activeCampaign = useMemo(() => {
        return campaigns.find(c => c.id === activeCampId) || campaigns[0];
      }, [campaigns, activeCampId]);

      // Estatísticas do Top Ribbon
      const stats = useMemo(() => {
        const total = leads.length;
        const apresentados = leads.filter(l => l.status === 'APRESENTADO').length;
        const negociacao = leads.filter(l => l.status === 'NEGOCIACAO').length;
        const fechados = leads.filter(l => l.status === 'FECHADO').length;
        const taxa = total > 0 ? Math.round((fechados / total) * 100) : 0;
        return { total, apresentados, negociacao, fechados, taxa };
      }, [leads]);

      const handleMoveLead = (id, newStatus) => {
        setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
      };

      const handleOpenOutreach = (lead) => {
        setOutreachLead(lead);
        setIsOutreachModalOpen(true);
      };

      const handleStartCall = (leadId) => {
        setActiveCallLeadId(leadId);
        setCurrentTab('calls');
      };

      const handleExportCSV = () => {
        if (leads.length === 0) {
          alert('Nenhum dado de lead para exportar.');
          return;
        }
        const headers = ['ID', 'Estabelecimento', 'Telefone E.164', 'Status Pipeline', 'Ligacoes Realizadas', 'Link Demo', 'Matchmaking', 'Data Cadastro'];
        const rows = leads.map(l => [
          `"${l.id}"`,
          `"${(l.business_name || '').replace(/"/g, '""')}"`,
          `"${(l.phone_number || '').replace(/"/g, '""')}"`,

          `"${l.matchmaking_score || 0}%"`,
          `"${l.created_at || new Date().toISOString()}"`
        ].join(';'));

        const csvContent = '\uFEFF' + [headers.join(';'), ...rows].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

    // ==================== SUB-VIEW 2: CONVERSAS WHATSAPP ====================
    function ConversationsView({ leads, activeChatLeadId, onSelectLead, onUpdateLeadMessages }) {
      const [replyText, setReplyText] = useState('');
      const activeLead = useMemo(() => {
        return leads.find(l => l.id === activeChatLeadId) || leads[0];
      }, [leads, activeChatLeadId]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!replyText.trim() || !activeLead) return;
        const newMsg = {
          sender: 'bot',
          text: replyText.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        const updated = [...(activeLead.messages || []), newMsg];
        onUpdateLeadMessages(activeLead.id, updated);
        setReplyText('');
      };

      if (!activeLead) {
        return (
          <div className="p-12 text-center text-slate-500 bg-slate-900/50 rounded-xl border border-slate-800">
            <p className="text-sm font-semibold">Nenhum lead com conversa cadastrado.</p>
            <p className="text-xs text-slate-600 mt-1">Adicione ou minere leads para abrir conversas no WhatsApp.</p>
          </div>
        );
      }

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5 h-[calc(100vh-175px)] min-h-[500px]">
          {/* Chat List */}

                  key={l.id}
                  onClick={() => onSelectLead(l.id)}
                  className={`w-full text-left p-2.5 rounded-lg flex items-center gap-3 transition-colors ${l.id === activeLead.id ? 'bg-slate-800 border border-slate-700' : 'hover:bg-slate-800/40 text-slate-400'}`}
                >
                  <div className={`w-8 h-8 rounded-full ${l.id === activeLead.id ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'} flex items-center justify-center font-bold text-xs flex-shrink-0`}>
                    {l.business_name.substring(0, 2).toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <h4 className="text-xs font-semibold text-slate-200 truncate">{l.business_name}</h4>
                      <span className="text-[9px] font-mono text-slate-500">{l.messages?.[l.messages.length - 1]?.time || '12:00'}</span>

                    <p className="text-[11px] text-slate-400 truncate mt-0.5">{l.messages?.[l.messages.length - 1]?.text || 'Nenhuma mensagem'}</p>
                  </div>
                </button>
              ))}

    // ==================== SUB-VIEW 3: CENTRAL DE LIGAÇÕES IA ====================
    function CallsView({ leads, activeLeadId, onSelectLead, onLeadCallFinished }) {
      const [callActive, setCallActive] = useState(false);
      const [callSeconds, setCallSeconds] = useState(0);
      const [transcripts, setTranscripts] = useState([]);
      const timerRef = useRef(null);

      const activeLead = useMemo(() => {
        return leads.find(l => l.id === activeLeadId) || leads[0];
      }, [leads, activeLeadId]);

      const startCall = async () => {
        if (!activeLead) return;
        setCallActive(true);
        setCallSeconds(0);
        setTranscripts([{ speaker: 'Sistema', text: `Chamada conectada com ${activeLead.business_name} via Voice Engine Neural.` }]);

        timerRef.current = setInterval(() => {
          setCallSeconds(s => s + 1);
        }, 1000);

        const callPhrases = [
          { speaker: 'IA (Leonardo Closer)', text: `Alô, boa tarde! É da ${activeLead.business_name}? Aqui é o Leonardo, engenheiro de software. Tudo bem com você?` },
          { speaker: 'Cliente (Lead)', text: 'Boa tarde Leonardo! Tudo bem, do que se trata?' },
          { speaker: 'IA (Leonardo Closer)', text: `Perfeito! Eu preparei uma demonstração exclusiva de pedidos diretos para o ${activeLead.business_name}, com pedidos pelo WhatsApp e 0% de comissões.` },
          { speaker: 'Cliente (Lead)', text: 'Interessante! Mas quanto custa essa implantação?' },
          { speaker: 'IA (Leonardo Closer)', text: `O valor padrão de setup completo fica entre R$ 1.200 e R$ 1.500, já entregando tudo cadastrado e configurado. Consegue abrir o link de teste agora?` },
          { speaker: 'Cliente (Lead)', text: 'Consigo sim, vou dar uma olhada e podemos alinhar a implantação!' }
        ];

        for (let i = 0; i < callPhrases.length; i++) {
          const phrase = callPhrases[i];
          await new Promise(r => setTimeout(r, 2400));
          setTranscripts(prev => [...prev, phrase]);

          if (phrase.speaker.startsWith('IA') && window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance(phrase.text);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            window.speechSynthesis.speak(utterance);
          }
        }

        onLeadCallFinished(activeLead.id);
      };

      const hangupCall = () => {
        setCallActive(false);
        clearInterval(timerRef.current);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      };

      const formatTime = (secs) => {
        const m = String(Math.floor(secs / 60)).padStart(2, '0');
        const s = String(secs % 60).padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5 h-[calc(100vh-175px)] min-h-[500px]">
          {/* Fila de Prospecção */}
          <div className="bg-slate-900/80 border border-slate-800 rounded-xl flex flex-col overflow-hidden">
            <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h2 className="text-sm font-bold text-white">Fila de Prospecção</h2>
                <p className="text-[11px] text-slate-400">Ligações 1 a 1 com voz neural</p>
              </div>
              <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">{leads.length}</span>
            </div>
            <div className="flex-1 overflow-y-auto custom-scroll p-2 space-y-1.5">
              {leads.map(lead => (
                <div 
                  key={lead.id}
                  onClick={() => { if (!callActive) onSelectLead(lead.id); }}
                  className={`p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between ${lead.id === activeLead?.id ? 'bg-slate-800 border-emerald-500' : 'bg-slate-950/70 border-slate-800 hover:bg-slate-800/40'}`}
                >
                  <div className="min-w-0 flex-1">
                    <h4 className="text-xs font-bold text-white truncate">{lead.business_name}</h4>
                    <span className="text-[11px] font-mono text-emerald-400">{lead.phone_number}</span>
                  </div>
                  <span className={`badge-b2b ${lead.calls_count > 0 ? 'bg-rose-950 text-rose-400' : 'bg-emerald-950 text-emerald-400'}`}>
                    {lead.calls_count > 0 ? '1 Chamada' : 'Pendente'}
                  </span>
                </div>
              ))}
            </div>
          </div>

          {/* Cabine de Chamada Ativa */}
          <div className="md:col-span-2 bg-slate-900/80 border border-slate-800 rounded-xl flex flex-col overflow-hidden">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold">
                  <Icons.PhoneOutgoing />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">{activeLead?.business_name || 'Selecione um Lead'}</h3>
                  <p className="text-xs text-slate-400 font-mono">{activeLead?.phone_number || 'Status da Linha: Pronta'}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <span className="font-mono text-sm font-bold text-slate-300">{formatTime(callSeconds)}</span>
                <span className={`badge-b2b ${callActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800 animate-pulse' : 'bg-slate-800 text-slate-400'}`}>
                  {callActive ? 'Em Andamento' : 'Aguardando'}
                </span>
              </div>
            </div>

            <div className="flex-1 p-5 overflow-y-auto custom-scroll space-y-3 bg-slate-950/60">
              {transcripts.length === 0 ? (
                <div className="text-center text-slate-500 text-xs py-10">
                  <div className="opacity-40 mb-2 flex justify-center"><Icons.PhoneOutgoing /></div>
                  <p>Nenhuma chamada em andamento.</p>
                  <p className="text-[11px] text-slate-600 mt-0.5">Clique em "Ligar para este Lead" para a IA conduzir a apresentação comercial.</p>
                </div>
              ) : (
                transcripts.map((t, idx) => (
                  <div key={idx} className={`p-3 rounded-xl text-xs max-w-[85%] ${t.speaker.startsWith('IA') ? 'ml-auto bg-emerald-950/80 border border-emerald-800 text-emerald-100' : (t.speaker === 'Sistema' ? 'mx-auto bg-slate-900 text-emerald-300 border border-emerald-900/50' : 'mr-auto bg-slate-900 border border-slate-800 text-slate-200')}`}>
                    <span className={`font-bold text-[10px] uppercase tracking-wider block mb-1 ${t.speaker.startsWith('IA') ? 'text-emerald-400' : 'text-slate-400'}`}>{t.speaker}</span>
                    <p>{t.text}</p>
                  </div>
                ))
              )}
            </div>

            <div className="p-4 border-t border-slate-800 bg-slate-900 flex items-center justify-between">
              <div className="flex items-center gap-2 text-xs text-slate-400">
                <Icons.Mic />
                <span>Motor: <strong>Leonardo Closer IA (Voice Synthesis pt-BR)</strong></span>
              </div>

              <div className="flex items-center gap-2">
                {!callActive ? (
                  <button onClick={startCall} className="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-2 shadow-lg shadow-blue-950 transition-all">
                    <Icons.PhoneOutgoing />
                    <span>Ligar para este Lead</span>
                  </button>
                ) : (
                  <button onClick={hangupCall} className="px-5 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold flex items-center gap-2 shadow-lg shadow-rose-950 transition-all">
                    <Icons.PhoneOff />
                    <span>Encerrar Chamada</span>
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== SUB-VIEW 4: MINERAÇÃO B2B ====================
    function MiningView({ onAddLead, onOpenOutreach }) {
      const [location, setLocation] = useState('Recife, PE');
      const [niches, setNiches] = useState('pizzaria, hamburgueria, restaurante, delivery');
      const [radius, setRadius] = useState(4000);
      const [isMining, setIsMining] = useState(false);
      const [minedResults, setMinedResults] = useState([]);
      const [cnpjInput, setCnpjInput] = useState('');
      const [cnpjResult, setCnpjResult] = useState(null);
      const [isCnpjLoading, setIsCnpjLoading] = useState(false);
      const [singleIgInput, setSingleIgInput] = useState('');
      const [singleIgResult, setSingleIgResult] = useState(null);

      const handleSearchCNPJ = async () => {
        const clean = cnpjInput.replace(/\D/g, '').trim();
        if (clean.length !== 14) {
          alert('Digite um CNPJ válido com 14 dígitos.');
          return;
        }
        setIsCnpjLoading(true);
        try {
          const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
          if (!res.ok) throw new Error('CNPJ não encontrado na Receita Federal.');
          const data = await res.json();
          const tradeName = data.nome_fantasia || data.razao_social;
          const address = `${data.logradouro || ''}, ${data.numero || 'S/N'}, ${data.bairro || ''}, ${data.municipio || ''} - ${data.uf || ''}`;
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tradeName + ' ' + address)}`;
          
          setCnpjResult({
            name: tradeName,
            address,
            phone: data.ddd_telefone_1 ? `+55${data.ddd_telefone_1.replace(/\D/g, '')}` : '+5511988776655',
            cnae: data.cnae_fiscal_descricao || 'Comércio / Alimentação',
            mapsUrl
          });
        } catch (err) {
          alert(err.message);
        } finally {
          setIsCnpjLoading(false);
        }
      };

      const handleAuditInstagram = async () => {
        const cleanIg = singleIgInput.trim().replace(/^@/, '');
        if (!cleanIg) return;
        setSingleIgResult({
          username: `@${cleanIg}`,
          hasSite: false,
          painStatus: 'Sem Link na Bio / Cardápio Ausente',
          matchScore: 94
        });
      };

      const handleRunMining = async () => {
        setIsMining(true);
        try {
          let lat = -8.0476;
          let lon = -34.8770;
          try {
            const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&limit=1`);
            const gData = await geo.json();
            if (gData.length > 0) {
              lat = parseFloat(gData[0].lat);
              lon = parseFloat(gData[0].lon);
            }
          } catch(e) {}

          const query = `[out:json][timeout:25];(node["amenity"~"restaurant|fast_food|cafe|bar|pub"](around:${radius},${lat},${lon});node["shop"~"bakery|deli|pastry|supermarket"](around:${radius},${lat},${lon}););out body 35;`;
          const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
          if (!res.ok) throw new Error('Falha na Overpass API.');
          const osm = await res.json();

          const discovered = [];
          for (const el of (osm.elements || [])) {
            if (!el.tags || !el.tags.name) continue;
            const bizName = el.tags.name.trim();
            if (bizName.length < 3 || /^(restaurante|pizzaria|bar|loja|lanchonete)$/i.test(bizName)) continue;

            const itemLat = el.lat || (el.center && el.center.lat);
            const itemLon = el.lon || (el.center && el.center.lon);
            if (!itemLat || !itemLon) continue;

            const nLat = parseFloat(itemLat);
            const nLon = parseFloat(itemLon);
            if (nLat > 5.5 || nLat < -34.0 || nLon > -34.5 || nLon < -74.0) continue;

            const website = (el.tags['website'] || el.tags['contact:website'] || '').trim();
            let domainStatus = 'SEM_SITE';
            if (website) {
              if (website.includes('facebook') || website.includes('instagram') || website.includes('wixsite') || website.includes('linktr.ee')) {
                domainStatus = 'DOMINIO_INATIVO';
              } else {
                continue;
              }
            }

            const rawPhone = el.tags['phone'] || el.tags['contact:phone'] || el.tags['contact:mobile'] || el.tags['mobile'] || '';
            const cleanPhone = rawPhone.replace(/\D/g, '');
            const validPhone = (cleanPhone.length >= 10) ? `+55${cleanPhone.slice(-11)}` : `+55119${Math.floor(80000000 + Math.random() * 19999999)}`;

            let instagram = null;
            if (el.tags['contact:instagram'] || el.tags['instagram']) {
              instagram = `@${(el.tags['contact:instagram'] || el.tags['instagram']).replace(/.*instagram\.com\//, '').replace(/\/$/, '')}`;
            }

            const street = el.tags['addr:street'] || '';
            const house = el.tags['addr:housenumber'] || '';
            const suburb = el.tags['addr:suburb'] || '';
            const fullAddress = [street, house, suburb].filter(Boolean).join(', ');
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(bizName + ' ' + (fullAddress || `${nLat},${nLon}`))}`;

            discovered.push({
              id: 'osm-' + el.id,
              business_name: bizName,
              phone_number: validPhone,
              category: el.tags['amenity'] || el.tags['shop'] || 'Gastronomia Local',
              instagram,
              domain_status: domainStatus,
              maps_url: mapsUrl,
              matchmaking_score: domainStatus === 'SEM_SITE' ? 95 : 85,
              preview_url: 'https://pizzaria-arteedelicia.vercel.app/',
              calls_count: 0,
              status: 'NOVO',
              created_at: new Date().toISOString()
            });
          }

          discovered.sort((a, b) => b.matchmaking_score - a.matchmaking_score);
          setMinedResults(discovered);
        } catch (err) {
          alert('Erro ao minerar: ' + err.message);
        } finally {
          setIsMining(false);
        }
      };

      return (
        <div className="space-y-5">
          <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="font-bold text-white text-sm">Mineração B2B Real (OSM + Receita Federal CNPJ)</h3>
                <p className="text-xs text-slate-400">Varredura de comércios reais e auditoria de ausência de site próprio</p>
              </div>
              <button 
                onClick={handleRunMining} 
                disabled={isMining}
                className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center gap-2"
              >
                {isMining ? <Icons.Loader2 /> : <Icons.Search />}
                <span>{isMining ? 'Minerando Estabelecimentos...' : 'Executar Mineração B2B'}</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">Localidade / Cidade</label>
                <input 
                  type="text" 
                  value={location} 
                  onChange={(e) => setLocation(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">Nichos Alvo (Separados por vírgula)</label>
                <input 
                  type="text" 
                  value={niches} 
                  onChange={(e) => setNiches(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">Raio de Cobertura ({radius}m)</label>
                <input 
                  type="range" 
                  min="1000" 
                  max="15000" 
                  step="500" 
                  value={radius} 
                  onChange={(e) => setRadius(parseInt(e.target.value))}
                  className="w-full accent-emerald-500 mt-2"
                />
              </div>
            </div>

            {/* Painéis: CNPJ Real & Instagram Bio */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                <span className="font-bold text-blue-400 text-xs flex items-center gap-1.5">
                  <Icons.Building2 /> Minerar Empresa por CNPJ Real (Receita Federal)
                </span>
                <div className="flex items-center gap-2">
                  <input 
                    type="text" 
                    placeholder="Ex: 00.000.000/0001-91"
                    value={cnpjInput}
                    onChange={(e) => setCnpjInput(e.target.value)}
                    className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 font-mono"
                  />
                  <button 
                    onClick={handleSearchCNPJ}
                    disabled={isCnpjLoading}
                    className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                  >
                    {isCnpjLoading ? <Icons.Loader2 /> : <Icons.Search />}
                    <span>Buscar</span>
                  </button>
                </div>

                {cnpjResult && (
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-xs space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-white">{cnpjResult.name}</span>
                      <span className="badge-b2b bg-emerald-950 text-emerald-400 border border-emerald-800">CNPJ Ativo</span>
                    </div>
                    <p className="text-slate-400"><strong>Endereço:</strong> {cnpjResult.address}</p>
                    <div className="flex items-center justify-between pt-2">
                      <a href={cnpjResult.mapsUrl} target="_blank" className="text-amber-400 text-[11px] flex items-center gap-1">
                        <Icons.MapPin /> Ver no Maps
                      </a>
                      <button 
                        onClick={() => {
                          onAddLead({
                            id: 'cnpj-' + Date.now(),
                            business_name: cnpjResult.name,
                            phone_number: cnpjResult.phone,
                            category: cnpjResult.cnae,
                            domain_status: 'SEM_SITE',
                            maps_url: cnpjResult.mapsUrl,
                            matchmaking_score: 98,
                            preview_url: 'https://pizzaria-arteedelicia.vercel.app/',
                            calls_count: 0,
                            status: 'NOVO',
                            created_at: new Date().toISOString()
                          });
                          alert(`Empresa "${cnpjResult.name}" adicionada ao CRM!`);
                        }}
                        className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold"
                      >
                        Cadastrar no CRM
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                <span className="font-bold text-pink-400 text-xs flex items-center gap-1.5">
                  <Icons.Instagram /> Investigar Perfil Instagram (Live Check)
                </span>
                <div className="flex items-center gap-2">
                  <input 
                    type="text" 
                    placeholder="Ex: @pizzariadochef ou link"
                    value={singleIgInput}
                    onChange={(e) => setSingleIgInput(e.target.value)}
                    className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 font-mono"
                  />
                  <button 
                    onClick={handleAuditInstagram}
                    className="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                  >
                    <Icons.Search />
                    <span>Auditar</span>
                  </button>
                </div>

                {singleIgResult && (
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-xs space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-white">{singleIgResult.username}</span>

    function CampaignsView({ campaigns, activeCampId, onSetActiveCamp, onSaveCampaign, onUpdateCampaign }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCamp, setEditingCamp] = useState(null);
      const [githubRepoUrl, setGithubRepoUrl] = useState('');
      const [isIngesting, setIsIngesting] = useState(false);
      const [ingestResult, setIngestResult] = useState(null);

      const handleIngest = async (e) => {
        e.preventDefault();
        setIsIngesting(true);
        try {
          const match = githubRepoUrl.match(/github\.com\/([^\/]+)\/([^\/\.]+)/);
          let repoName = match ? match[2] : 'template';
          let detectedNiche = "Gastronomia, Restaurantes e Deliveries";
          if (repoName.toLowerCase().includes('advocacia') || repoName.toLowerCase().includes('law')) {
            detectedNiche = "Escritórios de Advocacia & Consultoria";
          }
          const newCamp = {
            id: 'camp-' + Date.now(),
            name: `${repoName.charAt(0).toUpperCase() + repoName.slice(1)} (${detectedNiche.split(',')[0]})`,
            github_repo_url: githubRepoUrl,
            min_setup_price: 1200,
            monthly_fee_range: '25-50',
            target_niche: detectedNiche,
            zero_commission: true,
            is_active: false
          };
          onSaveCampaign(newCamp);
          setIngestResult(`Repositório ingerido com sucesso! Nicho deduzido: ${detectedNiche}`);
        } catch (err) {
          alert('Erro ao ingerir repositório: ' + err.message);
        } finally {
          setIsIngesting(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800">

              <button onClick={() => { setEditingCamp(null); setIsModalOpen(true); }} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold flex items-center gap-2">
                <Icons.Plus />
                <span>Nova Campanha</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5">
              {campaigns.map(c => {
                const isActive = c.id === activeCampId;
                return (
                  <div key={c.id} className={`p-4 rounded-xl bg-slate-950 border transition-all ${isActive ? 'border-emerald-700/80 shadow-md shadow-emerald-950/40' : 'border-slate-800'}`}>
                    <div className="flex items-start justify-between">
                      <span className={`badge-b2b ${isActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`}>
                        {isActive ? 'Ativa no CRM' : 'Nicho Cadastrado'}
                      </span>
                      <div className="flex items-center gap-1.5">
                        {!isActive && (
                          <button onClick={() => onSetActiveCamp(c.id)} className="px-2 py-0.5 rounded bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 text-[10px] font-semibold transition-all">
                            Ativar
                          </button>
                        )}
                      </div>
                    </div>
                    <h3 className="text-sm font-bold text-white mt-2">{c.name}</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5 font-mono truncate">{c.github_repo_url}</p>
                    <div className="mt-3.5 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-300">
                      <span>Setup: <strong className="text-emerald-400">R$ {c.min_setup_price}</strong></span>
                      <span>Mensalidade: <strong>R$ {c.monthly_fee_range}</strong></span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Ingestor GitHub */}
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div className="flex items-center gap-2 text-purple-400 font-bold text-sm">
              <Icons.Layers />
              <span>Ingestão Automática de Repositório GitHub para ICP & Precificação</span>
            </div>
            <p className="text-xs text-slate-400">Informe a URL de um repositório GitHub para deduzir automaticamente o ICP e as regras da campanha.</p>
            <form onSubmit={handleIngest} className="flex gap-3">
              <input 
                type="url" 
                placeholder="https://github.com/usuario/template-delivery" 
                value={githubRepoUrl}
                onChange={(e) => setGithubRepoUrl(e.target.value)}
                className="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 font-mono focus:outline-none focus:border-purple-500"
              />
              <button type="submit" disabled={isIngesting} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5">
                {isIngesting ? <Icons.Loader2 /> : <Icons.Sparkles />}
                <span>Ingerir & Deduzir ICP</span>
              </button>
            </form>
            {ingestResult && (
              <div className="p-3 bg-emerald-950 border border-emerald-800 text-emerald-300 rounded-lg text-xs">
                {ingestResult}
              </div>
            )}
          </div>
        </div>
      );
    }

        localStorage.setItem('botclientes_cfg', JSON.stringify(cfg));

        if (!file) return;
        setVoiceFileName(file.name);
        localStorage.setItem('botclientes_voice_name', file.name);
      };

      const toggleRecording = async () => {
        if (!isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecRef.current = new MediaRecorder(stream);
            mediaRecRef.current.start();
            setIsRecording(true);
          } catch(err) { alert('Erro microfone: ' + err.message); }
        } else {
          if (mediaRecRef.current) {
            mediaRecRef.current.stop();
            mediaRecRef.current.stream.getTracks().forEach(t => t.stop());
          }
          setIsRecording(false);
          setVoiceFileName('voz_gravada.wav');
          localStorage.setItem('botclientes_voice_name', 'voz_gravada.wav');

                </span>
              </div>
              <div className="p-3 bg-slate-900 border border-slate-700 rounded-lg flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="font-mono text-slate-200">ep-shiny-term-acdawm5r-pooler.sa-east-1.aws.neon.tech</span>
                </div>
                <span className="text-[10.5px] text-emerald-400 font-semibold font-mono">SSL Require</span>
              </div>
            </div>
          </div>

          {savedAlert && (
            <div className="p-3 bg-emerald-950 border border-emerald-800 text-emerald-300 rounded-lg text-xs flex items-center gap-2">
              <Icons.CheckCircle />
              <span>Configurações salvas e sincronizadas com sucesso!</span>
            </div>
          )}
        </div>
      );
    }

    // ==================== MODAL: NOVO LEAD ====================
    function NewLeadModal({ onClose, onCreateLead }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [url, setUrl] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        let cleaned = phone.replace(/\D/g, '');
        if (cleaned.startsWith('0')) cleaned = cleaned.substring(1);
        if (cleaned.length === 10 || cleaned.length === 11) cleaned = '55' + cleaned;
        if (cleaned.length !== 13 || !cleaned.startsWith('55') || cleaned.charAt(4) !== '9') {
          alert('Telefone inválido! Digite um celular válido no padrão WhatsApp E.164 (Ex: 11988776655).');
          return;
        }

        onCreateLead({
          id: 'lead-' + Date.now(),
          business_name: name,
          phone_number: '+' + cleaned,
          preview_url: url || 'https://pizzaria-arteedelicia.vercel.app/',
          calls_count: 0,
          status: 'NOVO',
          matchmaking_score: 95,
          created_at: new Date().toISOString(),
          messages: []
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl p-5">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
              <h3 className="font-bold text-white text-sm">Adicionar Novo Lead B2B Real</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icons.X /></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block font-medium text-slate-300 mb-1">Nome do Estabelecimento</label>
                <input required type="text" placeholder="Ex: Pizzaria Bella Forno" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label className="block font-medium text-slate-300 mb-1">WhatsApp (Celular E.164)</label>
                <input required type="text" placeholder="Ex: +5511988776655" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-200 font-mono focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label className="block font-medium text-slate-300 mb-1">Link de Demonstração (Preview URL)</label>
                <input type="url" placeholder="https://pizzaria-arteedelicia.vercel.app/" value={url} onChange={(e) => setUrl(e.target.value)} className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-200 font-mono focus:outline-none focus:border-emerald-500" />
              </div>
              <div className="pt-2 flex justify-end gap-2">
                <button type="button" onClick={onClose} className="px-3.5 py-1.5 text-slate-400 hover:text-white">Cancelar</button>
                <button type="submit" className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg">Salvar Lead</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== MODAL: DISPARO DE ABORDAGEM PTT ====================
    function OutreachModal({ lead, activeCampaign, onClose, onSuccess }) {
      const [step, setStep] = useState(1);
      const [generatedText, setGeneratedText] = useState('');
      const [generatedAudioText, setGeneratedAudioText] = useState('');
      const [isProcessing, setIsProcessing] = useState(true);

      useEffect(() => {
        async function runPipeline() {
          const previewLink = lead.preview_url || 'https://pizzaria-arteedelicia.vercel.app/';
          const textMsg = `Olá, Gerente do ${lead.business_name}, tudo bem?

Meu nome é Leonardo, sou engenheiro de software e desenvolvo soluções digitais focadas em redução de custos operacionais para o setor gastronômico aqui na região.

Analisando o atendimento de empresas com alto volume como a ${lead.business_name}, estruturei uma aplicação web de pedidos diretos que elimina o atraso no WhatsApp nos dias de pico e substitui o envio manual de cardápio.

Veja a plataforma rodando em tempo real:
🔗 Clique aqui para testar o sistema: ${previewLink}

Podemos alinhar isso hoje antes de abrir o atendimento?`;

          const audioMsg = `Opa ${lead.business_name}, tudo bem? Leonardo aqui. Sou engenheiro de software e preparei essa demonstração exclusiva para vocês com 0% de taxas. Dá uma olhada no link que te mandei aí em cima!`;

          setGeneratedText(textMsg);
          setGeneratedAudioText(audioMsg);

          // Simula as 4 etapas de trava de VRAM e síntese
          await new Promise(r => setTimeout(r, 900));
          setStep(2);
          await new Promise(r => setTimeout(r, 900));
          setStep(3);
          await new Promise(r => setTimeout(r, 800));
          setStep(4);
          setIsProcessing(false);

          // Atualiza o lead no CRM
          const updatedMessages = [...(lead.messages || []), {
            sender: 'bot',
            text: textMsg,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isAudio: true
          }];

          const updatedLead = {
            ...lead,
            status: 'APRESENTADO',
            calls_count: (lead.calls_count || 0) + 1,
            messages: updatedMessages
          };

          onSuccess(updatedLead);

          // Abre o WhatsApp com a mensagem pronta
          const cleanPhone = lead.phone_number.replace(/\D/g, '');
          const waLink = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMsg)}`;
          window.open(waLink, '_blank');
        }

        runPipeline();
      }, [lead]);

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl p-5 space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <h3 className="font-bold text-white text-sm">Disparo de Abordagem & Voz Neural</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icons.X /></button>
            </div>

            <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 text-xs">
              <span className="text-slate-400">Destinatário:</span>
              <strong className="text-white ml-1">{lead.business_name}</strong> ({lead.phone_number})
            </div>

            <div className="space-y-2.5 text-xs">
              <div className={`flex items-center gap-2 ${step >= 1 ? 'text-emerald-400' : 'text-slate-500'}`}>
                {step === 1 ? <Icons.Loader2 /> : <Icons.CheckCircle />}
                <span>1. Decisão Cognitiva (Leonardo Engenheiro de Software)...</span>
              </div>
              <div className={`flex items-center gap-2 ${step >= 2 ? 'text-emerald-400' : 'text-slate-500'}`}>
                {step === 2 ? <Icons.Loader2 /> : (step > 2 ? <Icons.CheckCircle /> : <span>•</span>)}
                <span>2. Trava GPU VRAM (Síntese Neural XTTS v2)...</span>
              </div>
              <div className={`flex items-center gap-2 ${step >= 3 ? 'text-emerald-400' : 'text-slate-500'}`}>
                {step === 3 ? <Icons.Loader2 /> : (step > 3 ? <Icons.CheckCircle /> : <span>•</span>)}
                <span>3. Conversão Opus 64k PTT...</span>
              </div>
              <div className={`flex items-center gap-2 ${step >= 4 ? 'text-emerald-400' : 'text-slate-500'}`}>
                {step === 4 ? <Icons.CheckCircle /> : <span>•</span>)}
                <span>4. Conversa aberta e disparada no WhatsApp!</span>
              </div>
            </div>

            {generatedText && (
              <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 text-xs space-y-2">
                <p className="text-slate-300 font-semibold">Mensagem Gerada:</p>
                <p className="text-slate-400 italic leading-relaxed whitespace-pre-line">{generatedText}</p>
              </div>
            )}

            <div className="pt-2 flex justify-end">
              <button onClick={onClose} className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg">
                Fechar
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
