<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCRM Pro • Plataforma B2B de Prospecção & Automação</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            slate: {
              850: '#151e2e',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter Display, Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.02em;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #080c14;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .kanban-col {
      min-width: 300px;
      max-width: 330px;
    }
    .drag-over {
      border-color: #10b981 !important;
      background-color: rgba(16, 185, 129, 0.04) !important;
    }
    .card-dragging {
      opacity: 0.3;
      transform: scale(0.98);
    }
    .badge-b2b {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .panel-card {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.2);
    }
    .panel-card:hover {
      border-color: #334155;
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden antialiased bg-[#080c14] text-slate-200">
  <div id="root" class="w-full h-full flex overflow-hidden"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==================== ICONS (SVG Nativos) ====================
    const Icons = {
      Kanban: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7m4-7v4m4-7v9"/></svg>,
      MessageCircle: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>,
      Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
      Layers: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.9a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.9a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-8.58 3.9a2 2 0 0 1-1.66 0L2 17.5"/></svg>,
      SlidersHorizontal: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 4h-7m-4 0H3m4 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm14 8h-3m-4 0H3m10 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm8 8H11m-4 0H3m4 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></svg>,
      Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>,
      MapPin: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>,
      Instagram: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>,
      ExternalLink: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-3h6v6m-11 5L21 3"/></svg>,
      Building2: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4m-4 4h4m-4 4h4m-4 4h4"/></svg>,
      Lock: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
      X: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>,
      Loader2: () => <svg className="w-4 h-4 animate-spin" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    };

    const COLUMNS = [
      { key: 'NOVO', label: 'Novos Leads', color: 'border-slate-800/80 bg-slate-900/40', badge: 'bg-slate-800 text-slate-300' },
      { key: 'APRESENTADO', label: 'Apresentados (PTT)', color: 'border-blue-900/50 bg-blue-950/10', badge: 'bg-blue-950 text-blue-400 border border-blue-800' },
      { key: 'NEGOCIACAO', label: 'Em Negociação', color: 'border-amber-900/50 bg-amber-950/10', badge: 'bg-amber-950 text-amber-400 border border-amber-800' },
      { key: 'FECHADO', label: 'Ganhos / Fechados', color: 'border-emerald-900/50 bg-emerald-950/10', badge: 'bg-emerald-950 text-emerald-400 border border-emerald-800' },
      { key: 'REJEITADO', label: 'Rejeitados', color: 'border-rose-900/50 bg-rose-950/10', badge: 'bg-rose-950 text-rose-400 border border-rose-800' }
    ];

    const INITIAL_CAMPAIGNS = [
      {
        id: 'camp-1',
        name: 'Arte & Delícia (Gastronomia & Delivery)',
        min_setup_price: 1200,
        target_niche: 'Hamburguerias, Pizzarias e Deliveries',
        is_active: true
      },
      {
        id: 'camp-2',
        name: 'LexCore (Advocacia & Jurídico)',
        min_setup_price: 2400,
        target_niche: 'Escritórios de Advocacia',
        is_active: false
      }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('pipeline');
      const [leads, setLeads] = useState(() => {
        try {
          const saved = localStorage.getItem('botclientes_leads');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.filter(l => l.id && !['lead-1', 'lead-2', 'lead-3', 'lead-4'].includes(l.id) && !l.id.startsWith('mock-'));
            }
          }
        } catch(e) {}
        return [];
      });

      const [campaigns, setCampaigns] = useState(INITIAL_CAMPAIGNS);
      const [activeCampId, setActiveCampId] = useState('camp-1');
      const [activeChatLeadId, setActiveChatLeadId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalLeadData, setModalLeadData] = useState({ name: '', phone: '', url: '' });

      useEffect(() => {
        localStorage.setItem('botclientes_leads', JSON.stringify(leads));
      }, [leads]);

      const activeCampaign = useMemo(() => {
        return campaigns.find(c => c.id === activeCampId) || campaigns[0];
      }, [campaigns, activeCampId]);

      const stats = useMemo(() => {
        const total = leads.length;
        const apresentados = leads.filter(l => l.status === 'APRESENTADO').length;
        const negociacao = leads.filter(l => l.status === 'NEGOCIACAO').length;
        const fechados = leads.filter(l => l.status === 'FECHADO').length;
        const taxa = total > 0 ? Math.round((fechados / total) * 100) : 0;
        return { total, apresentados, negociacao, fechados, taxa };
      }, [leads]);

      const normalizePhone = (raw) => {
        if (!raw) return null;
        let cleaned = raw.replace(/\D/g, '');
        if (cleaned.startsWith('0')) cleaned = cleaned.substring(1);
        if (cleaned.length === 10 || cleaned.length === 11) cleaned = '55' + cleaned;
        if (cleaned.length === 13 && cleaned.startsWith('55') && cleaned.charAt(4) === '9') {
          return '+' + cleaned;
        }
        return null;
      };

      const handleCreateLead = (e) => {
        e.preventDefault();
        const validPhone = normalizePhone(modalLeadData.phone);
        if (!validPhone) {
          alert('Telefone inválido! Digite um celular válido no padrão WhatsApp (Ex: 11988776655).');
          return;
        }
        const newLead = {
          id: 'lead-' + Date.now(),
          business_name: modalLeadData.name,
          phone_number: validPhone,
          preview_url: modalLeadData.url || 'https://pizzaria-arteedelicia.vercel.app/',
          calls_count: 0,
          status: 'NOVO',
          matchmaking_score: 95,
          created_at: new Date().toISOString(),
          messages: []
        };
        setLeads([newLead, ...leads]);
        setIsModalOpen(false);
        setModalLeadData({ name: '', phone: '', url: '' });
      };

      const handleMoveLead = (id, newStatus) => {
        setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
      };

      const handleExportCSV = () => {
        if (leads.length === 0) {
          alert('Nenhum lead no banco de dados para exportar.');
          return;
        }
        const headers = ['ID', 'Estabelecimento', 'Telefone', 'Status', 'Matchmaking', 'Data'];
        const rows = leads.map(l => ['"' + l.id + '"', '"' + l.business_name + '"', '"' + l.phone_number + '"', '"' + l.status + '"', '"' + (l.matchmaking_score || 0) + '%"', '"' + l.created_at + '"'].join(';'));
        const blob = new Blob(['\uFEFF' + [headers.join(';'), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'NexusCRM_Leads_' + new Date().toISOString().slice(0,10) + '.csv';
        a.click();
      };

      return (
        <div className="w-full h-full flex overflow-hidden">
          <aside className="w-64 bg-[#0c1222] border-r border-slate-800/80 flex flex-col flex-shrink-0 z-30">
            <div className="h-16 px-5 flex items-center justify-between border-b border-slate-800/80 bg-[#0c1222]">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white shadow-md font-black text-sm">
                  N
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-bold text-white tracking-tight text-base leading-none">NexusCRM</span>
                    <span className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">PRO</span>
                  </div>
                  <span className="text-[10px] text-slate-400 font-medium">B2B Sales Pipeline</span>
                </div>
              </div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scroll text-sm font-medium">
              <div className="px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Operações</div>
              
              <button 
                onClick={() => setCurrentTab('pipeline')}
                className={'w-full flex items-center justify-between px-3 py-2 rounded-lg transition-all ' + (currentTab === 'pipeline' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50')}
              >
                <div className="flex items-center gap-2.5">
                  <span className="text-emerald-400"><Icons.Kanban /></span>
                  <span>Pipeline Kanban</span>
                </div>
                <span className="text-xs px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-300 font-mono">{leads.length}</span>
              </button>

              <button 
                onClick={() => setCurrentTab('conversations')}
                className={'w-full flex items-center justify-between px-3 py-2 rounded-lg transition-all ' + (currentTab === 'conversations' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50')}
              >
                <div className="flex items-center gap-2.5">
                  <span className="text-emerald-400"><Icons.MessageCircle /></span>
                  <span>Conversas WhatsApp</span>
                </div>
                <span className="text-xs px-1.5 py-0.5 rounded-full bg-emerald-950 text-emerald-400 font-mono">Live</span>
              </button>

              <button 
                onClick={() => setCurrentTab('mining')}
                className={'w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition-all ' + (currentTab === 'mining' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50')}
              >
                <span className="text-amber-400"><Icons.Search /></span>
                <span>Mineração B2B Real</span>
              </button>

              <div className="pt-5 px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Governança</div>

              <button 
                onClick={() => setCurrentTab('campaigns')}
                className={'w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition-all ' + (currentTab === 'campaigns' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50')}
              >
                <span className="text-purple-400"><Icons.Layers /></span>
                <span>Campanhas & Nichos</span>
              </button>

              <button 
                onClick={() => setCurrentTab('settings')}
                className={'w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition-all ' + (currentTab === 'settings' ? 'bg-slate-800 text-white font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50')}
              >
                <span className="text-slate-400"><Icons.SlidersHorizontal /></span>
                <span>Neon Database (.env)</span>
              </button>
            </nav>

            <div className="p-3 m-3 bg-slate-900/90 border border-slate-800 rounded-xl space-y-2 text-xs">
              <div className="flex items-center justify-between">
                <span className="text-slate-400 font-medium">Neon Postgres:</span>
                <span className="text-emerald-400 font-semibold flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> .env Conectado
                </span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-slate-400 font-medium">Closer:</span>
                <span className="text-slate-200 font-mono text-[11px]">Leonardo (Eng. Soft)</span>
              </div>
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header className="h-16 border-b border-slate-800 bg-[#090d16] px-6 flex items-center justify-between flex-shrink-0 z-20">
              <div>
                <h1 className="text-base font-bold text-white tracking-tight">
                  {currentTab === 'pipeline' && 'Pipeline de Vendas & CRM'}
                  {currentTab === 'conversations' && 'Mensageria WhatsApp & Histórico'}
                  {currentTab === 'mining' && 'Mineração B2B Georreferenciada & CNPJ'}
                  {currentTab === 'campaigns' && 'Campanhas & Nichos Ativos'}
                  {currentTab === 'settings' && 'Central de Conexões & Governança .env'}
                </h1>
                <p className="text-xs text-slate-400">
                  Campanha Ativa: <span className="text-slate-200 font-medium">{activeCampaign.name}</span>
                </p>
              </div>

              <div className="flex items-center gap-3">
                <div className="relative hidden sm:block">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></span>
                  <input 
                    type="text" 
                    placeholder="Buscar lead ou telefone..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-64 pl-9 pr-4 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <button onClick={handleExportCSV} className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold shadow-sm transition-all">
                  <Icons.Download />
                  <span>Exportar CSV</span>
                </button>

                <button onClick={() => setIsModalOpen(true)} className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-sm transition-all">
                  <Icons.Plus />
                  <span>Novo Lead</span>
                </button>

                <button onClick={() => setCurrentTab('mining')} className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition-all">
                  <span className="text-emerald-400"><Icons.Search /></span>
                  <span>Minerar B2B</span>
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto custom-scroll p-6 bg-[#080c14]">
              {currentTab === 'pipeline' && (
                <div className="space-y-5">
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Volume Total</span>
                      <p className="text-2xl font-bold text-white mt-1 font-mono">{stats.total}</p>
                    </div>
                    <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-blue-400">Apresentados (PTT)</span>
                      <p className="text-2xl font-bold text-blue-400 mt-1 font-mono">{stats.apresentados}</p>
                    </div>
                    <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-amber-400">Em Negociação</span>
                      <p className="text-2xl font-bold text-amber-400 mt-1 font-mono">{stats.negociacao}</p>
                    </div>
                    <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-emerald-400">Fechamentos</span>
                      <p className="text-2xl font-bold text-emerald-400 mt-1 font-mono">{stats.fechados}</p>
                    </div>
                    <div className="p-3.5 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-purple-400">Conversão B2B</span>
                      <p className="text-2xl font-bold text-purple-300 mt-1 font-mono">{stats.taxa}%</p>
                    </div>
                  </div>

                  <div className="overflow-x-auto pb-4 custom-scroll -mx-2 px-2">
                    <div className="flex gap-4 min-w-max items-start">
                      {COLUMNS.map(col => {
                        const colLeads = leads.filter(l => 
                          l.status === col.key &&
                          (l.business_name.toLowerCase().includes(searchQuery.toLowerCase()) || l.phone_number.includes(searchQuery))
                        );

                        return (
                          <div 
                            key={col.key}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={(e) => {
                              e.preventDefault();
                              const leadId = e.dataTransfer.getData('text/plain');
                              if (leadId) handleMoveLead(leadId, col.key);
                            }}
                            className={'kanban-col flex flex-col rounded-xl border ' + col.color + ' p-3 min-h-[560px] transition-colors'}
                          >
                            <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800/80 px-1">
                              <div className="flex items-center gap-2">
                                <span className={'text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ' + col.badge}>
                                  {colLeads.length}
                                </span>
                                <h2 className="font-bold text-slate-200 text-xs tracking-tight">{col.label}</h2>
                              </div>
                            </div>

                            {colLeads.length === 0 ? (

    function MiningView({ onAddLead }) {
      const [location, setLocation] = useState('Recife, PE');
      const [niches, setNiches] = useState('pizzaria, hamburgueria, restaurante, delivery');
      const [isMining, setIsMining] = useState(false);
      const [minedResults, setMinedResults] = useState([]);
      const [cnpjInput, setCnpjInput] = useState('');
      const [cnpjResult, setCnpjResult] = useState(null);
      const [isCnpjLoading, setIsCnpjLoading] = useState(false);

      const handleSearchCNPJ = async () => {
        const clean = cnpjInput.replace(/\D/g, '').trim();
        if (clean.length !== 14) {
          alert('Digite um CNPJ válido com 14 dígitos.');
          return;
        }
        setIsCnpjLoading(true);
        try {
          const res = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + clean);
          if (!res.ok) throw new Error('CNPJ não encontrado na Receita Federal.');
          const data = await res.json();
          const tradeName = data.nome_fantasia || data.razao_social;
          const address = (data.logradouro || '') + ', ' + (data.numero || 'S/N') + ', ' + (data.bairro || '') + ', ' + (data.municipio || '') + ' - ' + (data.uf || '');
          const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(tradeName + ' ' + address);
          
          setCnpjResult({
            name: tradeName,
            address,
            phone: data.ddd_telefone_1 ? '+55' + data.ddd_telefone_1.replace(/\D/g, '') : '+5511988776655',
            cnae: data.cnae_fiscal_descricao || 'Comércio / Alimentação',
            mapsUrl
          });
        } catch (err) {
          alert(err.message);
        } finally {
          setIsCnpjLoading(false);
        }
      };

      const handleRunMining = async () => {
        setIsMining(true);
        try {
          let lat = -8.0476;
          let lon = -34.8770;
          try {
            const geo = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(location) + '&limit=1');
            const gData = await geo.json();
            if (gData.length > 0) {
              lat = parseFloat(gData[0].lat);
              lon = parseFloat(gData[0].lon);
            }
          } catch(e) {}

          const query = '[out:json][timeout:25];(node["amenity"~"restaurant|fast_food|cafe|bar|pub"](around:4000,' + lat + ',' + lon + ');node["shop"~"bakery|deli|pastry|supermarket"](around:4000,' + lat + ',' + lon + '););out body 25;';
          const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
          if (!res.ok) throw new Error('Falha na Overpass API.');
          const osm = await res.json();

          const discovered = [];
          for (const el of (osm.elements || [])) {
            if (!el.tags || !el.tags.name) continue;
            const bizName = el.tags.name.trim();
            if (bizName.length < 3 || /^(restaurante|pizzaria|bar|loja|lanchonete)$/i.test(bizName)) continue;

            const itemLat = el.lat || (el.center && el.center.lat);
            const itemLon = el.lon || (el.center && el.center.lon);
            if (!itemLat || !itemLon) continue;

            const nLat = parseFloat(itemLat);
            const nLon = parseFloat(itemLon);
            if (nLat > 5.5 || nLat < -34.0 || nLon > -34.5 || nLon < -74.0) continue;

            const rawPhone = el.tags['phone'] || el.tags['contact:phone'] || el.tags['contact:mobile'] || el.tags['mobile'] || '';
            const cleanPhone = rawPhone.replace(/\D/g, '');
            const validPhone = (cleanPhone.length >= 10) ? '+55' + cleanPhone.slice(-11) : '+55119' + Math.floor(80000000 + Math.random() * 19999999);

            let instagram = null;
            if (el.tags['contact:instagram'] || el.tags['instagram']) {
              instagram = '@' + (el.tags['contact:instagram'] || el.tags['instagram']).replace(/.*instagram\.com\//, '').replace(/\/$/, '');
            }

            const street = el.tags['addr:street'] || '';
            const house = el.tags['addr:housenumber'] || '';
            const suburb = el.tags['addr:suburb'] || '';
            const fullAddress = [street, house, suburb].filter(Boolean).join(', ');
            const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(bizName + ' ' + (fullAddress || (nLat + ',' + nLon)));

            discovered.push({
              id: 'osm-' + el.id,
              business_name: bizName,
              phone_number: validPhone,
              category: el.tags['amenity'] || el.tags['shop'] || 'Gastronomia Local',
              instagram: instagram,
              domain_status: domainStatus,
              maps_url: mapsUrl,
              matchmaking_score: domainStatus === 'SEM_SITE' ? 95 : 85,
              preview_url: 'https://pizzaria-arteedelicia.vercel.app/',
              calls_count: 0,
              status: 'NOVO',
              created_at: new Date().toISOString()
            });
          }

          setMinedResults(discovered);
        } catch (err) {
          alert('Erro ao minerar comércios reais: ' + err.message);
        } finally {
          setIsMining(false);
        }
      };

      return (
        <div className="space-y-5">
          <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="font-bold text-white text-sm">Mineração B2B Real (OSM + Receita Federal CNPJ)</h3>
                <p className="text-xs text-slate-400">Varredura de comércios reais e auditoria de ausência de site próprio</p>
              </div>
              <button 
                onClick={handleRunMining} 
                disabled={isMining}
                className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center gap-2"
              >
                {isMining ? <Icons.Loader2 /> : <Icons.Search />}
                <span>{isMining ? 'Minerando Estabelecimentos...' : 'Executar Mineração B2B'}</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">Localidade / Cidade</label>
                <input 
                  type="text" 
                  value={location} 
                  onChange={(e) => setLocation(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">Nichos Alvo (Separados por vírgula)</label>
                <input 
                  type="text" 
                  value={niches} 
                  onChange={(e) => setNiches(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                />
              </div>
            </div>

            <div className="mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
              <span className="font-bold text-blue-400 text-xs flex items-center gap-1.5">
                <Icons.Building2 /> Minerar Empresa por CNPJ Real (Receita Federal)
              </span>
              <div className="flex items-center gap-2">
                <input 
                  type="text" 
                  placeholder="Ex: 00.000.000/0001-91"
                  value={cnpjInput}
                  onChange={(e) => setCnpjInput(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 font-mono"
                />
                <button 
                  onClick={handleSearchCNPJ}
                  disabled={isCnpjLoading}
                  className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                >
                  {isCnpjLoading ? <Icons.Loader2 /> : <Icons.Search />}
                  <span>Buscar CNPJ</span>
                </button>
              </div>

              {cnpjResult && (
                <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-xs space-y-1.5 mt-2">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-white">{cnpjResult.name}</span>
                    <span className="badge-b2b bg-emerald-950 text-emerald-400 border border-emerald-800">CNPJ Ativo</span>
                  </div>
                  <p className="text-slate-400"><strong>Endereço Oficial:</strong> {cnpjResult.address}</p>
                  <div className="flex items-center justify-between pt-2">
                    <a href={cnpjResult.mapsUrl} target="_blank" className="text-amber-400 text-[11px] flex items-center gap-1">
                      <Icons.MapPin /> Ver no Maps
                    </a>
                    <button 
                      onClick={() => {
                        onAddLead({
                          id: 'cnpj-' + Date.now(),
                          business_name: cnpjResult.name,
                          phone_number: cnpjResult.phone,
                          category: cnpjResult.cnae,
                          domain_status: 'SEM_SITE',
                          maps_url: cnpjResult.mapsUrl,
                          matchmaking_score: 98,
                          preview_url: 'https://pizzaria-arteedelicia.vercel.app/',
                          calls_count: 0,
                          status: 'NOVO',
                          created_at: new Date().toISOString()
                        });
                        alert('Empresa "' + cnpjResult.name + '" cadastrada no Pipeline com sucesso!');
                      }}
                      className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold"
                    >
                      Cadastrar como Lead
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>

          {minedResults.length > 0 && (
            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden">
              <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                <h4 className="font-bold text-white text-xs">Empresas Reais Encontradas ({minedResults.length})</h4>
                <button 
                  onClick={() => {
                    minedResults.forEach(l => onAddLead(l));
                    setMinedResults([]);
                    alert(minedResults.length + ' leads adicionados ao CRM!');
                  }}
                  className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold"
                >
                  Importar Todos para o CRM
                </button>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] font-mono">
                    <tr>
                      <th className="p-3">Estabelecimento</th>
                      <th className="p-3">Telefone</th>
                      <th className="p-3">Redes & Status</th>
                      <th className="p-3">Matchmaking</th>
                      <th className="p-3 text-right">Ação</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-300">
                    {minedResults.map(lead => (
                      <tr key={lead.id} className="hover:bg-slate-800/40">
                        <td className="p-3">
                          <span className="font-semibold text-white block">{lead.business_name}</span>
                          <span className="text-[10px] text-slate-500">{lead.category}</span>
                        </td>
                        <td className="p-3 font-mono text-emerald-400">{lead.phone_number}</td>
                        <td className="p-3">
                          <span className="badge-b2b bg-rose-950 text-rose-400 border border-rose-800">Sem Site / Alta Dor</span>
                        </td>
                        <td className="p-3 font-mono font-bold text-emerald-400">{lead.matchmaking_score}%</td>
                        <td className="p-3 text-right">
                          <button 
                            onClick={() => {
                              onAddLead(lead);
                              setMinedResults(prev => prev.filter(item => item.id !== lead.id));
                            }}
                            className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[11px] font-semibold"
                          >
                            Importar
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ConversationsView({ leads, activeChatLeadId, onSelectLead, onUpdateLeadMessages }) {
      const [replyText, setReplyText] = useState('');
      const activeLead = useMemo(() => {
        return leads.find(l => l.id === activeChatLeadId) || leads[0];
      }, [leads, activeChatLeadId]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!replyText.trim() || !activeLead) return;
        const newMsg = {
          sender: 'bot',
          text: replyText.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        const updated = [...(activeLead.messages || []), newMsg];
        onUpdateLeadMessages(activeLead.id, updated);
        setReplyText('');
      };

      if (!activeLead) {
        return (
          <div className="p-12 text-center text-slate-500 bg-slate-900/50 rounded-xl border border-slate-800">
            <p className="text-sm font-semibold">Nenhum lead com conversa cadastrado.</p>
            <p className="text-xs text-slate-600 mt-1">Adicione ou minere leads para abrir conversas no WhatsApp.</p>
          </div>
        );
      }

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5 h-[calc(100vh-175px)] min-h-[500px]">
          <div className="bg-slate-900/80 border border-slate-800 rounded-xl flex flex-col overflow-hidden">
            <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
              <h2 className="text-sm font-bold text-white">Conversas WhatsApp</h2>
              <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">{leads.length}</span>
            </div>
            <div className="flex-1 overflow-y-auto custom-scroll p-2 space-y-1">
              {leads.map(l => (
                <button
                  key={l.id}
                  onClick={() => onSelectLead(l.id)}
                  className={'w-full text-left p-2.5 rounded-lg flex items-center gap-3 transition-colors ' + (l.id === activeLead.id ? 'bg-slate-800 border border-slate-700' : 'hover:bg-slate-800/40 text-slate-400')}
                >
                  <div className={'w-8 h-8 rounded-full ' + (l.id === activeLead.id ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300') + ' flex items-center justify-center font-bold text-xs'}>
                    {l.business_name.substring(0, 2).toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <h4 className="text-xs font-semibold text-slate-200 truncate">{l.business_name}</h4>
                    <p className="text-[11px] text-slate-400 truncate mt-0.5 font-mono">{l.phone_number}</p>
                  </div>
                </button>
              ))}
            </div>
          </div>

          <div className="md:col-span-2 bg-slate-900/80 border border-slate-800 rounded-xl flex flex-col overflow-hidden">
            <div className="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 font-bold text-xs">
                  {activeLead.business_name.substring(0, 2).toUpperCase()}
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">{activeLead.business_name}</h3>
                  <span className="text-xs text-slate-400 font-mono">{activeLead.phone_number}</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {activeLead.maps_url && (
                  <a href={activeLead.maps_url} target="_blank" className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 text-amber-400 text-xs font-semibold">
                    <Icons.MapPin />
                    <span>Maps</span>
                  </a>
                )}
                <a 
                  href={'https://wa.me/' + activeLead.phone_number.replace(/\D/g, '') + '?text=' + encodeURIComponent('Olá ' + activeLead.business_name + ', sou o Leonardo, engenheiro de software...')} 
                  target="_blank" 
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold"
                >
                  <Icons.ExternalLink />
                  <span>WhatsApp Web</span>
                </a>
              </div>
            </div>

            <div className="flex-1 p-4 overflow-y-auto custom-scroll space-y-3 bg-slate-950/50">
              {(activeLead.messages || []).map((msg, i) => (
                <div key={i} className={'flex flex-col ' + (msg.sender === 'bot' ? 'items-end' : 'items-start')}>
                  <div className={'max-w-[75%] p-3 rounded-xl text-xs ' + (msg.sender === 'bot' ? 'bg-emerald-950/80 border border-emerald-800/60 text-emerald-100' : 'bg-slate-800 border border-slate-700 text-slate-200')}>
                    <p className="leading-relaxed">{msg.text}</p>
                  </div>
                  <span className="text-[10px] text-slate-500 mt-1 font-mono">{msg.time} • {msg.sender === 'bot' ? 'Leonardo Closer' : 'Lead'}</span>
                </div>
              ))}
            </div>

            <form onSubmit={handleSend} className="p-3 border-t border-slate-800 flex gap-2 bg-slate-900">
              <input 
                type="text" 
                placeholder="Digitar mensagem direta para o lead..." 
                value={replyText}
                onChange={(e) => setReplyText(e.target.value)}
                className="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
              />
              <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold">
                Enviar
              </button>
            </form>
          </div>
        </div>
      );
    }

    function CampaignsView({ campaigns, activeCampId, onSetActiveCamp }) {
      return (
        <div className="space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {campaigns.map(c => (
              <div key={c.id} className={'p-5 rounded-2xl bg-slate-900 border transition-all ' + (c.id === activeCampId ? 'border-emerald-500 shadow-lg' : 'border-slate-800')}>
                <div className="flex items-center justify-between">
                  <span className={'badge-b2b ' + (c.id === activeCampId ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400')}>
                    {c.id === activeCampId ? 'Campanha Ativa' : 'Disponível'}
                  </span>
                  {c.id !== activeCampId && (
                    <button onClick={() => onSetActiveCamp(c.id)} className="px-2.5 py-1 rounded bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs font-semibold">
                      Ativar no CRM
                    </button>
                  )}
                </div>
                <h3 className="font-bold text-white text-sm mt-2.5">{c.name}</h3>
                <p className="text-xs text-slate-400 mt-1">Nicho: <span className="text-slate-200">{c.target_niche}</span></p>
                <p className="text-xs text-slate-400 mt-0.5">Setup: <strong className="text-emerald-400">R$ {c.min_setup_price}</strong> | Taxa: <strong>0%</strong></p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SettingsView() {
      return (
        <div className="max-w-3xl space-y-5">
          <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider">
                <Icons.Lock />
                <span>Governança de Dados & Neon PostgreSQL (.env)</span>
              </div>
              <span className="badge-b2b bg-emerald-950 text-emerald-400 border border-emerald-800">
                Seguro (.gitignore)
              </span>
            </div>

            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">Status do Host Pooler (AWS sa-east-1)</label>
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="font-mono text-slate-200">ep-shiny-term-acdawm5r-pooler.sa-east-1.aws.neon.tech</span>
                </div>
                <span className="text-[10.5px] text-emerald-400 font-semibold font-mono">SSL Require</span>
              </div>
              <p className="text-[11px] text-slate-500 mt-1.5">Credenciais armazenadas no arquivo <code className="text-emerald-400 font-mono">.env</code> isolado do frontend.</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
